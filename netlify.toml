# Netlify deploy config for www.ifthennow.com
#
# The site is static — no build step, no dependencies — so there is no build
# command. Netlify just publishes the itnwebsite/ folder as the document root,
# which makes index.html the site root and keeps assets/ and src/ alongside it
# exactly as they sit in the repo.

[build]
  publish = "itnwebsite"

# Deliberately no long-lived cache headers on assets/. The image filenames are
# not content-hashed, so an immutable cache would keep serving the old file after
# a graphic is replaced. Netlify's defaults (short cache + ETag revalidation) are
# the right trade-off until filenames are fingerprinted.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
